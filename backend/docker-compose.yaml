services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/src
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/ums
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ums
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: