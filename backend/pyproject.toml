[project]
name = "ums"
version = "0.1.0"
description = "University Management System — hexagonal, seven bounded contexts"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/academic_records",
    "src/admissions",
    "src/billing",
    "src/course_catalog",
    "src/enrollment",
    "src/faculty_department",
    "src/student_profile",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
