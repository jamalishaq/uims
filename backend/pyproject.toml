[project]
name = "ums"
version = "0.1.0"
description = "University Management System — hexagonal, eight bounded contexts"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pyjwt>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/event_bus.py",
    "src/http_api.py",
    "src/main.py",
    "src/persistence.py",
    "src/security.py",
    "src/academic_records",
    "src/admissions",
    "src/billing",
    "src/course_catalog",
    "src/enrollment",
    "src/faculty_department",
    "src/identity",
    "src/student_profile",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``tests`` is a plain directory rather than a package, so pytest imports its conftest as a
# top-level module and never puts this directory on the path. The per-context conftests all
# say ``from tests.conftest import Adapters`` to reach the composition root, which needs it.
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-q"
asyncio_mode = "auto"
# One event loop for the whole run. The Postgres engine and its connection pool are
# session-scoped, and a pooled connection opened on one loop cannot be handed to another.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
